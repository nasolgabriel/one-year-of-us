<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sophie — sleeping cat preview</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#0d0d0d;min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2.5rem;font-family:system-ui,sans-serif;padding:3rem}
  .label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#555}
  .row{display:flex;gap:3rem;align-items:flex-end;flex-wrap:wrap;justify-content:center}
  .card{display:flex;flex-direction:column;align-items:center;gap:1.2rem;
    padding:2.5rem 3rem;border-radius:24px;position:relative}
  .card .tag{font-size:11px;letter-spacing:.1em}
  .cream{background:linear-gradient(175deg,#FFF8EE 0%,#FEF0DC 60%,#FDDFC8 100%)}
  .cream .tag{color:#9a7355}
  .dark{background:#141228}
  .dark .tag{color:#8a7fb5}
  .big{transform:scale(2.4);transform-origin:center;margin:3.5rem 5rem}
  @keyframes breathe{0%,100%{transform:scaleY(1) translateY(0)}50%{transform:scaleY(1.035) translateY(-2px)}}
  .breathe{animation:breathe 3.8s ease-in-out infinite;transform-origin:66px 96px}
  @keyframes zfloat{0%{transform:translateY(0);opacity:0}22%{opacity:.6}100%{transform:translateY(-34px);opacity:0}}
  .z{position:absolute;font-weight:600;animation:zfloat 2.7s ease-out infinite}
  .catwrap{position:relative;width:132px;height:104px}
</style>
</head>
<body>
<p class="label">sophie — white + ginger curled sleeping cat</p>

<div class="row">
  <div class="card cream">
    <span class="tag">on hero (cream)</span>
    <div class="catwrap">
      <span class="z" style="left:96px;top:20px;font-size:9px;color:#CC7A42;animation-delay:0s">z</span>
      <span class="z" style="left:105px;top:8px;font-size:11px;color:#CC7A42;animation-delay:1.3s">z</span>
      <span class="z" style="left:116px;top:-4px;font-size:14px;color:#CC7A42;animation-delay:2.6s">z</span>
      <div id="c1"></div>
    </div>
  </div>

  <div class="card dark">
    <span class="tag">on locked (indigo)</span>
    <div class="catwrap"><div id="c2"></div></div>
  </div>

  <div class="card cream">
    <span class="tag">2.4× zoom</span>
    <div class="big"><div id="c3"></div></div>
  </div>
</div>

<script>
const C={white:'#FCF3E8',whiteHi:'#FFFFFF',ginger:'#E89456',gingerHi:'#F2A968',
  gingerLo:'#CC7339',outline:'#8A6047',innerEar:'#F2B3B8',nose:'#E0859A',
  eye:'#4A3322',whisker:'rgba(120,90,70,0.45)',shadow:'rgba(120,90,70,0.16)'}

const SVG = `
<svg class="breathe" width="132" height="104" viewBox="0 0 132 104" fill="none" style="overflow:visible;display:block">
  <ellipse cx="64" cy="97" rx="52" ry="6" fill="${C.shadow}"/>
  <path d="M 30 64 C 4 66 2 96 32 95 C 60 94 84 90 96 76" stroke="${C.gingerLo}" stroke-width="17" stroke-linecap="round" fill="none"/>
  <path d="M 30 64 C 6 66 5 93 32 92 C 58 91 82 87 95 74" stroke="${C.ginger}" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M 34 64 C 14 67 13 88 34 87" stroke="${C.gingerHi}" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
  <ellipse cx="58" cy="64" rx="47" ry="28" fill="${C.white}" stroke="${C.outline}" stroke-width="2.5"/>
  <path d="M 30 44 Q 56 33 84 44 Q 80 60 56 60 Q 36 58 30 44 Z" fill="${C.ginger}"/>
  <path d="M 34 45 Q 54 37 74 44" stroke="${C.gingerHi}" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <ellipse cx="54" cy="78" rx="30" ry="9" fill="${C.whiteHi}" opacity="0.6"/>
  <path d="M 75 38 L 80 13 L 96 34 Z" fill="${C.ginger}" stroke="${C.outline}" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 99 33 L 113 14 L 117 40 Z" fill="${C.ginger}" stroke="${C.outline}" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 81 34 L 84 21 L 92 33 Z" fill="${C.innerEar}"/>
  <path d="M 103 32 L 111 22 L 113 36 Z" fill="${C.innerEar}"/>
  <circle cx="97" cy="56" r="24" fill="${C.white}" stroke="${C.outline}" stroke-width="2.5"/>
  <path d="M 75 50 Q 97 30 119 51 Q 116 40 108 33 Q 86 26 82 40 Q 76 44 75 50 Z" fill="${C.ginger}"/>
  <path d="M 97 31 Q 109 34 116 47" stroke="${C.gingerHi}" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.55"/>
  <path d="M 86 57 Q 90 62 94 57" stroke="${C.eye}" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M 103 57 Q 107 62 111 57" stroke="${C.eye}" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M 97 65 L 101 65 L 99 68 Z" fill="${C.nose}"/>
  <path d="M 99 68 Q 99 71 96 71 M 99 68 Q 99 71 102 71" stroke="${C.outline}" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M 95 66 Q 80 64 70 67 M 95 69 Q 80 70 71 74" stroke="${C.whisker}" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M 103 66 Q 117 64 124 67 M 103 69 Q 117 70 123 74" stroke="${C.whisker}" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <ellipse cx="70" cy="86" rx="11" ry="7" fill="${C.white}" stroke="${C.outline}" stroke-width="2"/>
  <ellipse cx="88" cy="88" rx="11" ry="7" fill="${C.white}" stroke="${C.outline}" stroke-width="2"/>
  <path d="M 70 81 L 70 86 M 88 83 L 88 88" stroke="${C.outline}" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
</svg>`
;['c1','c2','c3'].forEach(id=>{document.getElementById(id).innerHTML=SVG})
</script>
</body>
</html>
